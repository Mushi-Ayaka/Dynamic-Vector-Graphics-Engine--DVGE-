<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>DV Auto-Bridge</title>
    <style>
        body {
            background-color: #1a1a1a;
            color: #d4d4d4;
            font-family: -apple-system, system-ui, sans-serif;
            font-size: 11px;
            display: flex;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            user-select: none;
        }
        .status-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ff3b3b; /* Red = Disconnected */
            margin-right: 6px;
            transition: background-color 0.3s;
        }
        .status-dot.connected {
            background-color: #4CAF50; /* Green = Connected */
            box-shadow: 0 0 5px rgba(76, 175, 80, 0.5);
        }
    </style>
</head>
<body>
    <div class="status-dot" id="led"></div>
    <span id="text">DV Engine: Desconectado</span>

    <script>
        const led = document.getElementById('led');
        const text = document.getElementById('text');
        
        let ws;
        let reconnectTimeout;

        function updateStatus(connected) {
            if (connected) {
                led.classList.add('connected');
                text.innerText = "DV Engine: Conectado (Auto-Import ON)";
            } else {
                led.classList.remove('connected');
                text.innerText = "DV Engine: Desconectado";
            }
        }

        function connect() {
            // Intentar conectar al Host de Electron Local
            ws = new WebSocket('ws://127.0.0.1:47821');

            ws.onopen = () => {
                updateStatus(true);
            };

            ws.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    
                    if (data.type === 'PING') {
                        ws.send(JSON.stringify({ type: 'PONG' }));
                    }
                    
                    if (data.type === 'RENDER_SUCCESS' && data.filepath) {
                        handleAutoImport(data.filepath);
                    }
                } catch (e) {
                    console.error("Error parsing WS message:", e);
                }
            };

            ws.onclose = () => {
                updateStatus(false);
                // Reconexión agresiva (cada 2 segundos)
                clearTimeout(reconnectTimeout);
                reconnectTimeout = setTimeout(connect, 2000);
            };

            ws.onerror = (e) => {
                ws.close();
            };
        }

        function handleAutoImport(filepath) {
            try {
                // API DOM global nativa embebida por DaVinci
                const resolve = window.App("Resolve");
                if (!resolve) return;

                const projectManager = resolve.GetProjectManager();
                const project = projectManager.GetCurrentProject();
                
                if (project) {
                    const mediaPool = project.GetMediaPool();
                    // JS API Nativa DaVinci para Importar
                    mediaPool.ImportMedia([filepath]);
                    console.log(`Auto-Import Exitoso: ${filepath}`);
                    
                    // Flash visual para feedback del usuario
                    document.body.style.backgroundColor = '#2c5234';
                    setTimeout(() => {
                        document.body.style.backgroundColor = '#1a1a1a';
                    }, 500);
                }
            } catch (err) {
                console.error("DaVinci JS API Error:", err);
            }
        }

        // Inicializar
        connect();
    </script>
</body>
</html>
